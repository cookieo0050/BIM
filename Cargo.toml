[package]
name = "raytracer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.27", features = ["wgpu"] }
egui = "0.27"
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.24"
image = "0.24"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
naga = { version = "0.19.2", features = ["wgsl-in"] }
